# S8Q Kernel Configuration (Upstream openbmc/linux dev-6.18)
# Platform: Facebook S8Q (Nvidia VR C2)

# Large memory support
CONFIG_VMSPLIT_3G_OPT=y
CONFIG_HAVE_CLK=y
CONFIG_OF=y

# Aspeed Clock
CONFIG_COMMON_CLK=y

# HW Random
CONFIG_HW_RANDOM=y

# Devmem
CONFIG_DEVMEM=y

# PCI & PCIe (Upstream)
CONFIG_PCI=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCI_DEBUG=y
CONFIG_PCI_STUB=y
CONFIG_PCI_IOV=y
CONFIG_PCI_PRI=y
CONFIG_PCI_MSI=y
# CONFIG_PCIE_PME is not set

# MCTP Subsystem & Upstream Transports (I2C, USB)
CONFIG_MCTP=y
CONFIG_MCTP_FLOWS=y
CONFIG_MCTP_TRANSPORT_I2C=y
CONFIG_MCTP_TRANSPORT_USB=y

# I2C & SMBus
CONFIG_I2C_ASPEED=n
CONFIG_I2C_SMBUS=y

# IPMI & SSIF
CONFIG_IPMI_HANDLER=y
CONFIG_IPMI_DEVICE_INTERFACE=y
CONFIG_IPMB_DEVICE_INTERFACE=y
CONFIG_SSIF_IPMI_BMC=y
CONFIG_IPMI_SSIF=m

# USB Host & Drivers
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_AUTOSUSPEND_DELAY=-1
CONFIG_USB_MON=y
CONFIG_USB_ACM=y

# USB Net (CDC / ECM / RNDIS)
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_CDC_SUBSET_ENABLE=y
CONFIG_USB_NET_CDC_SUBSET=y
CONFIG_USB_ETH=y
CONFIG_USB_F_ECM=y
CONFIG_USB_F_RNDIS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_ETH_RNDIS=y

# USB HID & CP2112
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_HIDRAW=y
CONFIG_USB_HIDDEV=y
CONFIG_HID_CP2112=y

# DMA & UART / Serial
CONFIG_DMADEVICES=y
CONFIG_SERIAL_8250_DMA=y
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_CONSOLE=y
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_XR=y

# SPI & Storage
CONFIG_CHR_DEV_SG=y
CONFIG_SPI_SPIDEV=y
CONFIG_SPI_GPIO=y
CONFIG_SPI_BITBANG=y

# Filesystems
CONFIG_MSDOS_FS=y
CONFIG_FAT_DEFAULT_UTF8=y

# Networking & PHY
CONFIG_NCSI_OEM_CMD_GET_MAC=y
CONFIG_FIXED_PHY=y
CONFIG_MDIO_BUS=y
CONFIG_MDIO_ASPEED=y

# GPIO & Regulator
CONFIG_GPIO_ASPEED_SGPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# RTC Drivers
CONFIG_RTC_DRV_NCT3018Y=y

# Hwmon Sensors (VR C2 / S8Q supported in upstream)
CONFIG_SENSORS_MAX31790=y
CONFIG_SENSORS_LM90=y
CONFIG_SENSORS_TMP401=y
CONFIG_SENSORS_ADT7475=y
CONFIG_SENSORS_LTC4286=y
CONFIG_SENSORS_MP5990=y
CONFIG_SENSORS_MP5926=y
CONFIG_SENSORS_XDP710=y

# PSTORE
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y

# Loadable Modules
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODVERSIONS=y
